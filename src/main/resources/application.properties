# Configuração base, com padrões seguros. Perfis:
#   dev  -> application-dev.properties  (SQL no log e mensagens de erro detalhadas)
#   prod -> application-prod.properties (sem Swagger/OpenAPI). É o padrão do docker-compose.yml.

# Fora do Docker (IDE, mvn), as credenciais podem vir do .env na raiz do projeto. Variáveis de
# ambiente têm precedência; dentro do container não há .env e a importação é ignorada.
spring.config.import=optional:file:.env[.properties]

# Sem senha padrão no código: sem DB_PASSWORD (ou DB_APP_PASSWORD do .env) a aplicação não sobe.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/concessionaria?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_APP_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${DB_APP_PASSWORD}}

spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.jpa.show-sql=false

# Respostas de erro do Spring (fora do ApiExceptionHandler) não expõem detalhes internos (SEC-13)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Atrás do Nginx (/api) e do proxy do Vite: os links HATEOAS usam X-Forwarded-Proto/Host/Prefix.
# O Nginx sobrescreve ou apaga esses cabeçalhos (frontend/nginx/proxy-backend.conf).
server.forward-headers-strategy=framework

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

# Autenticação (Etapa 3a). JWT_SECRET não tem valor padrão: sem ele a aplicação não sobe.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.access-token-ttl=15m
app.auth.session-ttl=10h
app.auth.refresh-reuse-grace=10s
# Caminho do cookie como o navegador vê a rota (/api/auth atrás do Nginx e do proxy do Vite)
app.auth.cookie-path=${AUTH_COOKIE_PATH:/api/auth}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.max-tentativas=5
app.auth.bloqueio=15m
# Vazio = só a mesma origem (o painel é servido pelo mesmo endereço da API)
app.auth.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Usuários iniciais: criados só se ainda não existirem; senha vazia = usuário não é criado
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.gerente-password=${SEED_GERENTE_PASSWORD:}
app.seed.vendedor-password=${SEED_VENDEDOR_PASSWORD:}
