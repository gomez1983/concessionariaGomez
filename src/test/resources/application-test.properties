spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/concessionaria_test?createDatabaseIfNotExist=true&serverTimezone=UTC}
# Os testes criam e apagam o schema concessionaria_test, por isso usam o root do MySQL.
# Sem TEST_DB_PASSWORD, vale o MYSQL_ROOT_PASSWORD do .env (importado pelo application.properties).
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:${MYSQL_ROOT_PASSWORD}}

spring.flyway.locations=classpath:db/migration,classpath:db/testdata

# Autenticação nos testes: segredo SOMENTE de teste. Sem proxy, a rota é /auth (sem /api) e o servidor é http.
app.auth.jwt-secret=c2VncmVkby1kZS10ZXN0ZS1nb21lei1uYW8tdXNhci1lbS1wcm9kdWNhby0wMDAx
app.auth.cookie-path=/auth
app.auth.cookie-secure=false
app.seed.admin-password=
app.seed.gerente-password=
app.seed.vendedor-password=

# Flyway usa uma conexão adicional ao executar callbacks SQL de teste.
spring.datasource.hikari.maximum-pool-size=2
