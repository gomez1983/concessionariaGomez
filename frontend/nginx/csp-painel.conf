# CSP do painel (SEC-10).
# - script-src 'self': o tema inicial fica em /tema.js, sem script inline.
# - style-src 'unsafe-inline': o Radix Dialog injeta um <style> para travar a rolagem, e a página de créditos usa <style>.
# - img-src blob: fotos protegidas baixadas com token (useImagemAutenticada); data: ícones embutidos.
# - connect-src viacep.com.br: preenchimento de endereço pelo CEP (lib/cep.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://viacep.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
