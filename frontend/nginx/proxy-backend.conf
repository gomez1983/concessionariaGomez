# Cabeçalhos repassados ao backend. A API usa server.forward-headers-strategy=framework para montar
# os links (HATEOAS, OpenAPI) a partir deles, então todos são definidos aqui e os que o cliente
# poderia forjar são apagados (valor "" faz o Nginx não repassar o cabeçalho).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";

# O Spring Security já envia estes dois; o Nginx manda os seus sem duplicar
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
