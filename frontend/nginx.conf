server {
    # Imagem nginx-unprivileged: o processo não roda como root e escuta na 8080 (SEC-16)
    listen 8080;
    server_name localhost;

    # Não revela a versão do Nginx nos cabeçalhos e nas páginas de erro
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/cabecalhos-seguranca.conf;
    include /etc/nginx/snippets/csp-painel.conf;

    # Compressão gzip para melhor desempenho
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA routing: qualquer rota cliente devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redireciona /api para /api/
    location = /api {
        return 301 /api/;
    }

    # Proxy reverso para a API Spring Boot (^~ evita captura por regex de estáticos)
    location ^~ /api/ {
        proxy_pass http://backend:8080/;
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_buffering off;
        client_max_body_size 15M;
    }

    # Documentação Swagger UI e OpenAPI acessíveis pela mesma porta (^~ preserva .js/.css do Swagger).
    # No perfil prod a API desliga o springdoc e estas rotas respondem 404.
    location ^~ /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        include /etc/nginx/snippets/proxy-backend.conf;
        # O Swagger chama a API pelo /api do Nginx: o OpenAPI e o swagger-config anunciam esse prefixo
        proxy_set_header X-Forwarded-Prefix /api;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        # O Swagger UI usa estilos inline e ícones em data:, mas nenhum script inline
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        include /etc/nginx/snippets/proxy-backend.conf;
        # O Swagger chama a API pelo /api do Nginx: o OpenAPI e o swagger-config anunciam esse prefixo
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # Script do tema: sem hash no nome, então não pode ficar no cache imutável de 1 ano
    location = /tema.js {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        include /etc/nginx/snippets/csp-painel.conf;
        add_header Cache-Control "no-cache";
    }

    # Cache de arquivos estáticos do frontend
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        include /etc/nginx/snippets/csp-painel.conf;
        add_header Cache-Control "public, immutable";
    }

    # index.html sem cache para sempre carregar novos deploys
    location = /index.html {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        include /etc/nginx/snippets/csp-painel.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
